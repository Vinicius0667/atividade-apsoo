services:
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: client
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d client"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
      build: .
      container_name: meu-projeto-java
      depends_on:
        db:
          condition: service_healthy
      environment:
        - DB_URL=jdbc:postgresql://db:5432/client
        - DB_USER=root
        - DB_PASSWORD=root
      ports:
        - "8080:8080"
      restart: unless-stopped
